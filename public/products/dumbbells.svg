<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Adjustable dumbbells placeholder">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C99A"/>
      <stop offset="60%" stop-color="#B07A2E"/>
      <stop offset="100%" stop-color="#5C3B14"/>
    </linearGradient>
    <linearGradient id="db-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="db-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#db-bg)"/>
  <rect width="800" height="600" fill="url(#db-glow)"/>
  <g transform="translate(400 300)">
    <rect x="-220" y="-14" width="440" height="28" rx="6" fill="#E5C089"/>
    <g transform="translate(-220 0)">
      <circle r="58" fill="url(#db-plate)"/>
      <circle r="58" fill="none" stroke="#E5C089" stroke-width="6"/>
      <circle r="22" fill="#E5C089"/>
    </g>
    <g transform="translate(220 0)">
      <circle r="58" fill="url(#db-plate)"/>
      <circle r="58" fill="none" stroke="#E5C089" stroke-width="6"/>
      <circle r="22" fill="#E5C089"/>
    </g>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Adjustable Dumbbells</text>
  <text x="400" y="540" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#ffffff" opacity="0.85">50lb Pair · Replaces 15 Sets</text>
</svg>
