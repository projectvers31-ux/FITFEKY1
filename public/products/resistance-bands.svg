<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Resistance bands set placeholder">
  <defs>
    <linearGradient id="rb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C2C7"/>
      <stop offset="55%" stop-color="#C24A52"/>
      <stop offset="100%" stop-color="#7A2A30"/>
    </linearGradient>
    <linearGradient id="rb-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="rb-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#rb-bg)"/>
  <rect width="800" height="600" fill="url(#rb-glow)"/>
  <g transform="translate(400 260)" fill="none" stroke="url(#rb-band)" stroke-linecap="round">
    <ellipse rx="330" ry="135" stroke-width="22"/>
    <ellipse rx="270" ry="105" stroke-width="22" transform="rotate(14)"/>
    <ellipse rx="210" ry="78" stroke-width="22" transform="rotate(-12)"/>
  </g>
  <g transform="translate(120 120)" fill="#ffffff" opacity="0.85">
    <circle r="6"/>
  </g>
  <g transform="translate(680 480)" fill="#ffffff" opacity="0.6">
    <circle r="4"/>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Resistance Bands</text>
  <text x="400" y="540" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#ffffff" opacity="0.85">5-Pack · 5 Resistance Levels</text>
</svg>
