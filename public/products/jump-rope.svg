      <stop offset="0%" stop-color="#FFB59A"/>
      <stop offset="55%" stop-color="#E26946"/>
      <stop offset="100%" stop-color="#5B1F12"/>
    </linearGradient>
    <radialGradient id="jr-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#jr-bg)"/>
