<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Kettlebell placeholder">
  <defs>
    <linearGradient id="kb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="kb-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="kb-handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <radialGradient id="kb-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFD86B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD86B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#kb-bg)"/>
  <rect width="800" height="600" fill="url(#kb-glow)"/>
  <g transform="translate(400 320)">
    <path d="M -80 -160 Q -80 -180 -60 -180 L 60 -180 Q 80 -180 80 -160 L 80 -120 Q 110 -100 110 -50 Q 110 80 60 110 L -60 110 Q -110 80 -110 -50 Q -110 -100 -80 -120 Z" fill="url(#kb-body)" stroke="#000000" stroke-width="4"/>
    <ellipse cx="0" cy="-150" rx="80" ry="22" fill="none" stroke="url(#kb-handle)" stroke-width="20" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="#FFD86B" stroke-width="3" opacity="0.4"/>
    <text x="0" y="10" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FFD86B" letter-spacing="-1">20</text>
    <text x="0" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFD86B" letter-spacing="2" opacity="0.85">LBS</text>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Kettlebell 20lb</text>
  <text x="400" y="540" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#ffffff" opacity="0.85">Cast Iron · Vinyl Coated</text>
</svg>
