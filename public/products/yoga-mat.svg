<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Yoga mat placeholder">
  <defs>
    <linearGradient id="ym-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBEFD3"/>
      <stop offset="60%" stop-color="#C7A56A"/>
      <stop offset="100%" stop-color="#5C3B14"/>
    </linearGradient>
    <linearGradient id="ym-roll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="ym-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ym-bg)"/>
  <rect width="800" height="600" fill="url(#ym-glow)"/>
  <g transform="translate(180 240)">
    <ellipse cx="0" cy="60" rx="44" ry="44" fill="url(#ym-roll)"/>
    <ellipse cx="0" cy="60" rx="44" ry="44" fill="none" stroke="#7A5A24" stroke-width="4"/>
    <rect x="0" y="40" width="440" height="40" rx="14" fill="url(#ym-roll)" stroke="#7A5A24" stroke-width="4"/>
    <ellipse cx="440" cy="60" rx="44" ry="44" fill="url(#ym-roll)"/>
    <ellipse cx="440" cy="60" rx="44" ry="44" fill="none" stroke="#7A5A24" stroke-width="4"/>
    <g opacity="0.4" stroke="#7A5A24" stroke-width="2">
      <line x1="80" y1="60" x2="80" y2="65"/>
      <line x1="160" y1="60" x2="160" y2="65"/>
      <line x1="240" y1="60" x2="240" y2="65"/>
      <line x1="320" y1="60" x2="320" y2="65"/>
      <line x1="400" y1="60" x2="400" y2="65"/>
    </g>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Premium Yoga Mat</text>
  <text x="400" y="540" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#ffffff" opacity="0.85">6mm Cushion · Non-Slip</text>
</svg>
