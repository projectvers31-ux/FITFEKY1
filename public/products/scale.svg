    <text x="0" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#7AE3B5" letter-spacing="1">G</text>
    <g opacity="0.6">
